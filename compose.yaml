services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    restart: unless-stopped
    environment:
      MODE: ws
      WEBUI_TOKEN: ${NAPCAT_WEBUI_TOKEN:?Set NAPCAT_WEBUI_TOKEN in .env}
    ports:
      - "127.0.0.1:6099:6099"
    volumes:
      - ./data/qq:/app/.config/QQ
      - ./data/napcat-config:/app/napcat/config
      - ./data/napcat-plugins:/app/napcat/plugins
  assistant:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      ONEBOT_URL: ws://napcat:3001
      DB_PATH: /data/assistant.sqlite3
      MAIL_CONFIG: /config/mailboxes.json
    volumes:
      - ./data/assistant:/data
      - ./config:/config:ro
    depends_on:
      - napcat
